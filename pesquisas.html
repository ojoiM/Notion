<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="stylesheet" href="style.css">
  <style>
    iframe {
      width: 100%;
      height: 90vh; 
      border: none;
    }

    .floating-icon {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999; 
    }

    .floating-icon img {
      width: 100px; /* Tamanho do ícone */
      height: auto;
      cursor: pointer;
    }

    .header-container {
      text-align: center;
      padding: 20px;
      font-size: 2em;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="header"><strong>📼✨ Vídeos ✨📼</strong></div>
  </div>

  <!-- Ícone  flutuante -->
  <div class="floating-icon">
    <a href="index.html">
      <img src="https://i.imgur.com/tCvnwlm.png" alt="Voltar">
    </a>
  </div>

  <!--  Miro -->
  <div class="container">
    <iframe src="https://miro.com/app/live-embed/uXjVI9CVGq4=/?moveToViewport=-768,-368,1536,735&embedId=169449197231" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  </div>

</body>
</html>
