<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pesquisas</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .floating-icon {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
    }

    .floating-icon img {
      width: 200px;
      height: auto;
      cursor: pointer;
    }

    .header-container {
      text-align: center;
      padding: 20px;
      font-size: 2em;
    }

    .container {
      padding-left: 200px; /* Deixa espaço para o ícone */
      box-sizing: border-box;
    }

    iframe {
      width: 150%; /* Ajuste conforme teu desejo: 130%, 150%, 180%... */
      height: 90vh; /* 90% da altura da janela */
      border: none;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="header"><strong>💡✨ Pesquisas ✨💡</strong></div>
  </div>

  <!-- Ícone flutuante -->
  <div class="floating-icon">
    <a href="index.html">
      <img src="https://i.imgur.com/tCvnwlm.png" alt="Voltar">
    </a>
  </div>

  <!-- Miro embed -->
  <div class="container">
    <iframe src="https://miro.com/app/board/uXjVI9CVGq4=/?share_link_id=911146169684" allowfullscreen></iframe>
  </div>

</body>
</html>
