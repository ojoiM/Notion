<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pesquisas</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .floating-icon {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
    }

    .floating-icon img {
      width: 200px;
      height: auto;
      cursor: pointer;
    }

    .header-container {
      text-align: center;
      padding: 20px;
      font-size: 2em;
    }

  
  </style>
</head>
<body>

  <div class="header-container">

  </div>

  <!-- Ícone flutuante -->
  <div class="floating-icon">
    <a href="index.html">

    </a>
  </div>

<div style="display: justify-content: center; margin-bottom: 40px;">
  <iframe
    src="https://miro.com/app/board/uXjVI9CVGq4=/?share_link_id=911146169684"
    style="width: 1500px; height: 800px; border: none;"
    allowfullscreen
  ></iframe>
</div>

<!-- Seção do Google Docs com imagem ao lado -->
<div style="display: flex; justify-content: center; align-items: flex-start; gap: 20px; margin-bottom: 60px; flex-wrap: wrap;">

  <img
    src="https://i.imgur.com/hR5SybH.jpeg"
